<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="nginxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="950" height="580" fill="url(#bgGrad)" rx="16"/>

  <rect x="25" y="20" width="900" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">KIẾN TRÚC NGINX REVERSE PROXY VÀ PHÂN LUỒNG PATH MATCHING</text>
  <text x="475" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Port 80 Entrypoint • Static Serving (/) • Dynamic Reverse Proxy (/api/) • Spring Boot (8082)</text>

  <!-- Left: Clients -->
  <g transform="translate(40, 105)">
    <rect width="230" height="340" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="230" height="42" rx="12" fill="url(#clientGrad)"/>
    <text x="115" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">NGƯỜI DÙNG / CLIENT</text>

    <g transform="translate(15, 60)">
      <rect width="200" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="100" y="24" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Truy cập Trang chủ</text>
      <text x="100" y="44" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">GET http://server/</text>
      <text x="100" y="62" font-family="sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Yêu cầu nội dung tĩnh</text>
      <text x="100" y="78" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Port 80 (HTTP)</text>
    </g>

    <g transform="translate(15, 175)">
      <rect width="200" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="100" y="24" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Yêu cầu API Backend</text>
      <text x="100" y="44" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">GET /api/health</text>
      <text x="100" y="62" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">POST /api/login</text>
      <text x="100" y="80" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Port 80 (Chung cổng)</text>
    </g>
  </g>

  <!-- Middle: Nginx Reverse Proxy -->
  <g transform="translate(300, 105)">
    <rect width="330" height="340" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="330" height="42" rx="12" fill="url(#nginxGrad)"/>
    <text x="165" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">NGINX REVERSE PROXY (PORT 80)</text>

    <!-- Branch 1: Static -->
    <g transform="translate(15, 52)">
      <rect width="300" height="95" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="15" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">Phân luồng 1: location /</text>
      <text x="15" y="44" font-family="monospace" font-size="11" fill="#ecfdf5">root /var/www/html;</text>
      <text x="15" y="62" font-family="monospace" font-size="11" fill="#ecfdf5">index index.html index.htm;</text>
      <text x="15" y="82" font-family="sans-serif" font-size="10" fill="#a7f3d0">Phục vụ trực tiếp file tĩnh tốc độ cao</text>
    </g>

    <!-- Branch 2: Proxy Pass -->
    <g transform="translate(15, 160)">
      <rect width="300" height="155" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="15" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#fde68a">Phân luồng 2: location /api/</text>
      <text x="15" y="44" font-family="monospace" font-size="10.5" fill="#fde68a">proxy_pass http://127.0.0.1:8082/;</text>
      <text x="15" y="64" font-family="monospace" font-size="9.5" fill="#94a3b8">proxy_set_header Host $host;</text>
      <text x="15" y="80" font-family="monospace" font-size="9.5" fill="#94a3b8">proxy_set_header X-Real-IP $remote_addr;</text>
      <text x="15" y="96" font-family="monospace" font-size="9.5" fill="#94a3b8">proxy_set_header X-Forwarded-For ...;</text>
      <text x="15" y="112" font-family="monospace" font-size="9.5" fill="#94a3b8">proxy_set_header X-Forwarded-Proto ...;</text>
      <text x="15" y="136" font-family="sans-serif" font-size="10" fill="#34d399">Giữ nguyên thông tin định danh Client thực</text>
    </g>
  </g>

  <!-- Right: Destinations -->
  <g transform="translate(660, 105)">
    <rect width="250" height="340" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="250" height="42" rx="12" fill="url(#targetGrad)"/>
    <text x="125" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ĐÍCH PHỤC VỤ (BACKEND)</text>

    <!-- Target 1 -->
    <g transform="translate(15, 52)">
      <rect width="220" height="100" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="110" y="22" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#34d399" text-anchor="middle">Trang Tĩnh (File System)</text>
      <text x="110" y="42" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">/var/www/html/index.html</text>
      <text x="110" y="60" font-family="sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Thông tin học viên</text>
      <text x="110" y="76" font-family="sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">HTML5, CSS responsive</text>
      <text x="110" y="92" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Trả về mã HTTP 200</text>
    </g>

    <!-- Target 2 -->
    <g transform="translate(15, 175)">
      <rect width="220" height="135" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
      <text x="110" y="22" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="middle">Spring Boot Application</text>
      <text x="110" y="42" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">127.0.0.1:8082 (Internal)</text>
      <text x="110" y="60" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Dịch vụ: spring-app.service</text>
      <text x="110" y="76" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">User: spring-runner</text>
      <text x="110" y="94" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Xử lý business &amp; MySQL</text>
      <text x="110" y="118" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Ẩn hoàn toàn khỏi Internet</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 270 160 L 300 160" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <path d="M 270 280 L 300 280" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
  <path d="M 630 160 L 660 160" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <path d="M 630 280 L 660 280" stroke="#fbbf24" stroke-width="2.5" fill="none"/>

  <!-- Footer Banner -->
  <rect x="40" y="470" width="870" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="60" y="495" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">ƯU ĐIỂM KIẾN TRÚC NGINX REVERSE PROXY:</text>
  <text x="60" y="517" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Đơn giản hóa cổng kết nối: Client chỉ cần nhớ một cổng 80 duy nhất cho cả trang web giao diện và API backend.</text>
  <text x="60" y="537" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Tăng tốc tối đa: Nginx phục vụ trang tĩnh từ ổ đĩa với hiệu năng cực cao, giải phóng bộ nhớ và tài nguyên CPU cho JVM Spring Boot.</text>
</svg>
